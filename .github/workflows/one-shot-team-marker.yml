name: One-shot team marker update

on:
  push:
    branches:
      - final-clean-verify

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-clean-verify
          fetch-depth: 0

      - name: Update team marker to show name and command together
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/overlay/TeamPanel.jsx')
          s = p.read_text(encoding='utf-8')

          s = s.replace('  const [showCommand, setShowCommand] = useState(false);\n', '')

          old_effect = '''  useEffect(() => {\n    if (!commandPrompt || isFrozen || isDamaged || isGalaxyBenefited || isDonutActive || isCowboyActive) { setShowCommand(false); return undefined; }\n    const id = setInterval(() => setShowCommand(v => !v), 4000);\n    return () => clearInterval(id);\n  }, [commandPrompt, isFrozen, isDamaged, isGalaxyBenefited, isDonutActive, isCowboyActive]);\n\n'''
          s = s.replace(old_effect, '')
          s = s.replace('  const commandVisible = !!commandPrompt && !isFrozen && !isDamaged && !isGalaxyBenefited && !isDonutActive && !isCowboyActive;\n', '  const commandVisible = !!commandPrompt;\n')

          old_jsx = '''      <div className="team-name" style={teamNameStyle}>\n        {!commandVisible || !showCommand ? <span>{nameText}</span> : <span style={commandStyle}>ESCRIBE <strong style={{color:commandColor,fontWeight:1000}}>{commandPrompt}</strong> PARA UNIRTE</span>}\n      </div>'''
          new_jsx = '''      <div className="team-name" style={{...teamNameStyle, flexDirection:"column", gap:"3px", minHeight: commandVisible ? "38px" : "20px"}}>\n        <span>{nameText}</span>\n        {commandVisible && <span style={commandStyle}>ESCRIBE <strong style={{color:commandColor,fontWeight:1000}}>{commandPrompt}</strong> PARA UNIRTE</span>}\n      </div>'''

          if old_jsx not in s:
              raise SystemExit('Expected TeamPanel marker markup was not found; refusing to modify the file.')
          s = s.replace(old_jsx, new_jsx)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify changed file
        run: |
          grep -q 'flexDirection:"column"' src/components/overlay/TeamPanel.jsx
          grep -q 'ESCRIBE <strong' src/components/overlay/TeamPanel.jsx

      - name: Commit and self-remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/overlay/TeamPanel.jsx .github/workflows/one-shot-team-marker.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: show team name and registration command together'
          git push origin final-clean-verify
