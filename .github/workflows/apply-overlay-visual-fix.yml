name: Apply overlay visual fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply visual fix and self-remove workflow
        shell: bash
        run: |
          cat >> src/components/overlay/overlay.css <<'EOF'

/* =========================================================
   COCOLOCO VISUAL FIX - MVP / PLAYER INFO CONTAINER
   Dark broadcast card, large bold readable typography.
   IMPORTANT: !important intentionally overrides legacy inline styles.
   ========================================================= */
.players-box{
  background:linear-gradient(145deg,rgba(11,20,34,.98),rgba(21,34,52,.98))!important;
  border:1.5px solid rgba(0,191,255,.65)!important;
  color:#fff!important;
  box-shadow:0 5px 16px rgba(0,0,0,.68),inset 0 1px 2px rgba(255,255,255,.10),0 0 12px rgba(0,191,255,.18)!important;
  animation:mvpContainerPulse 3.8s ease-in-out infinite;
}
.players-box .players-title{
  color:#fff!important;
  font-size:10px!important;
  font-weight:950!important;
  letter-spacing:1px!important;
  text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 7px rgba(255,215,0,.30)!important;
}
.players-box .gamer-player{
  background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(0,191,255,.08))!important;
  color:#fff!important;
  border:1px solid rgba(255,255,255,.10);
  min-height:22px;
  padding:3px 5px!important;
  font-size:11px!important;
  font-weight:800!important;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.06);
  animation:mvpRowGlow 3.2s ease-in-out infinite;
}
.players-box .player-position,
.players-box .player-name,
.players-box .player-points{
  color:#fff!important;
  font-size:11px!important;
  font-weight:950!important;
  text-shadow:0 1px 4px rgba(0,0,0,.95)!important;
}
.players-box .player-points{
  color:#ffd700!important;
  font-size:11px!important;
  font-weight:950!important;
  white-space:nowrap;
}
.players-box .rank-up-highlight{
  background:linear-gradient(90deg,rgba(57,255,136,.24),rgba(255,215,0,.14))!important;
  border-color:rgba(57,255,136,.45)!important;
}

@keyframes mvpContainerPulse{
  0%,100%{box-shadow:0 5px 16px rgba(0,0,0,.68),inset 0 1px 2px rgba(255,255,255,.10),0 0 10px rgba(0,191,255,.14)}
  50%{box-shadow:0 5px 18px rgba(0,0,0,.72),inset 0 1px 2px rgba(255,255,255,.14),0 0 18px rgba(0,191,255,.30)}
}
@keyframes mvpRowGlow{
  0%,100%{transform:translateX(0);filter:brightness(1)}
  50%{transform:translateX(1px);filter:brightness(1.08)}
}
EOF

          rm -f .github/workflows/apply-overlay-visual-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/overlay/overlay.css .github/workflows/apply-overlay-visual-fix.yml
          git commit -m "Fix overlay player info readability and animation"
          git push
